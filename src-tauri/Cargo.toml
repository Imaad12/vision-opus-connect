[package]
name = "app"
version = "0.1.0"
description = "VINCO ERP desktop client -- a Tauri shell around the same React/TanStack frontend the web app uses. No business logic lives here: every request goes to the same FastAPI backend as the web client."
authors = ["Vision Contracting Co."]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# tauri-plugin-opener is a small general-purpose "open this in the
# system default app" utility, kept for any future need to open a link
# or file externally. Desktop uses native VINCO username/password login
# (see src/components/sign-in-card.tsx) -- no OAuth, no browser handoff,
# no vinco:// callback URL, no PKCE, so the deep-link plugin that used to
# exist solely to receive that callback has been removed entirely,
# rather than left registered-but-unused: an OS-level URL-scheme
# registration that runs on every launch is real production behavior,
# not inert dead code, and this build has no feature left that needs it.
tauri-plugin-opener = "2"
# Prevents a second launch from opening a second window; must stay the
# first .plugin() call in lib.rs (the crate's own documented
# requirement). No "deep-link" feature: that feature only exists to
# forward a second launch's URL to the deep-link plugin, which this app
# no longer has.
tauri-plugin-single-instance = { version = "2" }
# Desktop session storage is a plain JSON file under the OS per-app data
# directory (see src/session_store.rs) -- no extra dependency needed
# beyond serde_json (already required above) and Tauri's own path
# resolver. Previously backed by the `keyring` crate (Windows Credential
# Manager / macOS Keychain / Linux Secret Service); removed because an
# unsigned/ad-hoc-signed build's macOS Keychain authorization prompt
# reappeared on every single rebuild (see session_store.rs's module docs
# for why), with no code-level fix short of a stable code-signing
# identity, which isn't available in this build pipeline yet.
