[package]
name = "app"
version = "0.1.0"
description = "VINCO ERP desktop client -- a Tauri shell around the same React/TanStack frontend the web app uses. No business logic lives here: every request goes to the same FastAPI backend as the web client."
authors = ["Vision Contracting Co."]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Google OAuth must run in the system browser, not this window's webview --
# Google blocks sign-in from embedded/non-standard user agents (see
# src/lib/tauri-auth.ts). tauri-plugin-opener launches the system browser;
# tauri-plugin-deep-link registers the vinco:// scheme the OS hands back to
# this app once Supabase completes the OAuth redirect.
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Windows/Linux only forward a second vinco:// launch to this plugin,
# which (via the "deep-link" feature) re-emits it as the deep-link
# plugin's normal event -- without it a second launch would just open an
# unauthenticated second window instead of completing sign-in in the
# first. Must stay the first .plugin() call in lib.rs (the crate's own
# documented requirement).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Desktop session storage is a plain JSON file under the OS per-app data
# directory (see src/session_store.rs) -- no extra dependency needed
# beyond serde_json (already required above) and Tauri's own path
# resolver. Previously backed by the `keyring` crate (Windows Credential
# Manager / macOS Keychain / Linux Secret Service); removed because an
# unsigned/ad-hoc-signed build's macOS Keychain authorization prompt
# reappeared on every single rebuild (see session_store.rs's module docs
# for why), with no code-level fix short of a stable code-signing
# identity, which isn't available in this build pipeline yet.
