[project]
name = "vision-contracting-profit"
version = "0.1.0"
description = "Private business application for Vision Contracting Company: project, quotation and profitability management."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "PyMuPDF>=1.24,<2.0",
    "PySide6>=6.6,<7.0",
    "google-api-python-client>=2.120,<3.0",
    "google-auth>=2.28,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
