services:
  - type: web
    name: vinco-api
    runtime: docker
    # This backend now lives at backend/ inside the consolidated
    # `vision-opus-connect` repository (merged via `git subtree` from the
    # former standalone `vision-contracting-profit` repo, full history
    # preserved -- see that repo's root README.md). Render's service has
    # since been repointed in the dashboard (Settings -> Build & Deploy)
    # to this repository, branch `main`, Root Directory `backend` -- but
    # it is still the SAME service that originally deployed the old
    # standalone `vision-contracting-profit` repo (its live URL is still
    # vision-contracting-profit.onrender.com, not vinco-api.onrender.com),
    # created long before this file existed. That distinction matters:
    # see the `preDeployCommand` note directly below.
    branch: main
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Intent: run `alembic upgrade head` against VISION_DATABASE_URL
    # before the new image is swapped in, on every deploy, so the live
    # schema can never silently lag the code that's about to start
    # querying it.
    #
    # THIS FIELD ONLY TAKES EFFECT AUTOMATICALLY IF RENDER MANAGES THIS
    # SERVICE AS A SYNCED BLUEPRINT (created via "New +" -> "Blueprint",
    # kept in blueprint-sync mode). A service that was created as a
    # plain Web Service and later just had its connected GitHub repo
    # swapped in Settings -- exactly this service's own history, per the
    # comment above -- does NOT thereby start reading `preDeployCommand`
    # (or any other field) from whatever `render.yaml` the newly
    # connected repo happens to contain. It keeps running whatever
    # Pre-Deploy Command is set (or left blank) on that service's own
    # Settings -> Build & Deploy tab, full stop.
    #
    # This is exactly what caused two real production incidents, not
    # one: code shipped in commits df745ad/cc4a9ce added
    # app_users.must_change_password/password_changed_at (migration
    # 6d263c6d93a5) and the import_batches table (0316ad9e1d33); later,
    # code shipped in eae6ae9 added import_batches.notes/.archived_at,
    # import_jobs, and imported_documents.storage_bucket/.storage_key
    # (migration 7a1c9e2f5b3d). In both cases this field already said
    # `alembic upgrade head`, and in both cases the live database never
    # actually got it, because this service was never wired to run it --
    # every request touching the new columns/tables 500'd with a
    # Postgres UndefinedColumn error the moment each deploy went live.
    #
    # The durable fix is in the Render dashboard, not this file: set
    # Settings -> Build & Deploy -> Pre-Deploy Command to
    # `alembic upgrade head` directly on the service itself. That field
    # is independent of Blueprint sync and runs regardless of how the
    # service was created. `GET /health` (app/api/routers/health.py)
    # also now refuses to report "ok" if the connected PostgreSQL
    # database is behind this code's own Alembic head, so if this gap
    # ever reopens, the next deploy fails Render's own health check
    # instead of going live and 500ing -- see
    # app/database/schema_check.py's own docstring.
    #
    # Uses the plain `alembic` CLI, not scripts/safe_production_migrate.sh
    # -- that script's interactive confirmation prompts are for a human
    # running it by hand, not an unattended deploy step; the safety this
    # step instead relies on is what it's always relied on: migrations
    # are additive/reviewed-in-PR (see README's "no destructive
    # migrations" principle), so `upgrade head` here is exactly as safe
    # as merging the migration file itself already was.
    preDeployCommand: "alembic upgrade head"
    envVars:
      # Supabase Session Pooler connection string, in the form
      # postgresql+psycopg://user:password@host:5432/dbname
      # (get the exact host from Supabase Dashboard -> Project Settings ->
      # Database -> Connection string -> Session pooler tab). Set as a
      # secret in the Render dashboard -- never commit a real value.
      - key: VISION_DATABASE_URL
        sync: false
      # Supabase project URL, e.g. https://<ref>.supabase.co
      - key: VISION_SUPABASE_URL
        sync: false
      # Supabase anon/publishable key (safe to expose client-side, but
      # still set as a Render secret rather than committed here).
      - key: VISION_SUPABASE_ANON_KEY
        sync: false
      # Service-role key -- required since the native VINCO user-
      # management routes (POST /users, reset-password) create/manage
      # real Supabase Auth identities via the Admin API. See
      # app/api/auth.py's SupabaseAdmin for the narrow boundary around
      # this (only user_service.py ever holds/uses it). A real secret,
      # set directly in the Render dashboard -- never committed here.
      # Listed here only so this file stays a complete, accurate record
      # of what this service actually needs configured.
      - key: VISION_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Comma-separated list of allowed frontend origins, e.g.
      # https://vinco.pages.dev,https://app.yourdomain.com
      - key: VISION_CORS_ALLOWED_ORIGINS
        sync: false
      - key: VISION_LOG_LEVEL
        value: INFO
      # The PostgreSQL schema VINCO's own tables live in, isolated from
      # the same database's `public` schema -- which the Supabase
      # project this backend authenticates against already owns (Auth/
      # RBAC tables, plus pre-existing UUID-keyed application tables
      # that collide by name with several of VINCO's, e.g. `contacts`/
      # `projects`/`invoices`). Not a secret -- committed as a plain
      # value. Also the code default (app/core/config.py), so this
      # entry exists for documentation/explicitness, not because
      # anything breaks without it.
      - key: VISION_STAGING_SCHEMA
        value: vinco

  # The ingestion worker (P4 of the production-reliability pass -- see
  # app/worker.py's own module docstring). Same repository, same Docker
  # image as vinco-api above -- only `dockerCommand` differs, running
  # `python -m app.worker`'s polling loop instead of `uvicorn`. This is
  # what actually calls `import_service.run_extraction` for every
  # document uploaded through POST /imports/batches/{id}/documents; the
  # web service itself never does (see that route's own docstring on why
  # FastAPI BackgroundTasks were removed -- they don't survive this same
  # web service being redeployed/restarted mid-run, which is exactly what
  # was silently stranding in-progress OCR before this pass).
  #
  # `type: worker` on Render never receives HTTP traffic and has no
  # `healthCheckPath` -- Render's own liveness signal for this service
  # type is simply "the process is still running"; `app/worker.py`'s own
  # try/except around `main()` exits non-zero on an unhandled crash so
  # Render's automatic restart-on-crash behavior still applies.
  # `preDeployCommand: alembic upgrade head` is deliberately NOT
  # duplicated here -- only vinco-api runs migrations before its new
  # image goes live, so exactly one process ever runs `alembic upgrade
  # head` per deploy, never two services racing to apply the same
  # migration concurrently.
  #
  # Env vars are duplicated from vinco-api's block above rather than
  # factored into a shared `envVarGroups:` entry -- this keeps every
  # value this worker actually needs visible in one place without
  # depending on Render's env-var-group blueprint syntax being verified
  # against a real deploy from this environment (this repo's own
  # networking policy cannot reach Render to confirm it); worth
  # consolidating once someone can verify that syntax against a real
  # Render account. Every secret below must be set to the SAME value as
  # vinco-api's in the Render dashboard (this worker reads and writes the
  # identical database and, when configured, the identical Supabase
  # Storage bucket).
  - type: worker
    name: vinco-import-worker
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: "python -m app.worker"
    plan: starter
    envVars:
      - key: VISION_DATABASE_URL
        sync: false
      - key: VISION_SUPABASE_URL
        sync: false
      - key: VISION_SUPABASE_ANON_KEY
        sync: false
      - key: VISION_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VISION_LOG_LEVEL
        value: INFO
      - key: VISION_STAGING_SCHEMA
        value: vinco
