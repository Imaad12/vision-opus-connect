services:
  - type: web
    name: vinco-api
    runtime: docker
    # This backend now lives at backend/ inside the consolidated
    # `vision-opus-connect` repository (merged via `git subtree` from the
    # former standalone `vision-contracting-profit` repo, full history
    # preserved -- see that repo's root README.md). Render's own service
    # still points at the OLD standalone backend repo until manually
    # repointed in the dashboard -- a `branch:` value in this file cannot
    # change which GitHub repository a Render service is connected to,
    # only which branch of its *current* one. The one manual step this
    # consolidation needs: Render dashboard -> vinco-api service ->
    # Settings -> Build & Deploy -> change the connected repository to
    # vision-opus-connect, branch `main`, and set Root Directory to
    # `backend`. `dockerfilePath: ./Dockerfile` below is already correct
    # for that (resolves relative to Root Directory, i.e.
    # backend/Dockerfile) and needs no change once Root Directory is set.
    # Until that manual step happens, the old vision-contracting-profit
    # repo's `claude/postgres-productionization` branch remains the real
    # deploy source -- do not archive/delete it first.
    branch: main
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Runs `alembic upgrade head` against VISION_DATABASE_URL before the
    # new image is swapped in, on every deploy. Without this, a deploy
    # only ever changes what code is running -- the live schema stays
    # wherever it last was, silently, until someone happens to run
    # migrations by hand. That gap is exactly what caused a real
    # production incident: code shipped in commits df745ad/cc4a9ce added
    # app_users.must_change_password/password_changed_at (migration
    # 6d263c6d93a5) and the import_batches table (0316ad9e1d33), neither
    # of which was ever applied here, so every query touching app_users'
    # full column set (GET /users/me, POST /users) 500'd with a Postgres
    # UndefinedColumn error the moment that code went live. Uses the
    # plain `alembic` CLI, not scripts/safe_production_migrate.sh --
    # that script's interactive confirmation prompts are for a human
    # running it by hand, not an unattended deploy step; the safety this
    # step instead relies on is what it's always relied on: migrations
    # are additive/reviewed-in-PR (see README's "no destructive
    # migrations" principle), so `upgrade head` here is exactly as safe
    # as merging the migration file itself already was.
    preDeployCommand: "alembic upgrade head"
    envVars:
      # Supabase Session Pooler connection string, in the form
      # postgresql+psycopg://user:password@host:5432/dbname
      # (get the exact host from Supabase Dashboard -> Project Settings ->
      # Database -> Connection string -> Session pooler tab). Set as a
      # secret in the Render dashboard -- never commit a real value.
      - key: VISION_DATABASE_URL
        sync: false
      # Supabase project URL, e.g. https://<ref>.supabase.co
      - key: VISION_SUPABASE_URL
        sync: false
      # Supabase anon/publishable key (safe to expose client-side, but
      # still set as a Render secret rather than committed here).
      - key: VISION_SUPABASE_ANON_KEY
        sync: false
      # Service-role key -- required since the native VINCO user-
      # management routes (POST /users, reset-password) create/manage
      # real Supabase Auth identities via the Admin API. See
      # app/api/auth.py's SupabaseAdmin for the narrow boundary around
      # this (only user_service.py ever holds/uses it). A real secret,
      # set directly in the Render dashboard -- never committed here.
      # Listed here only so this file stays a complete, accurate record
      # of what this service actually needs configured.
      - key: VISION_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Comma-separated list of allowed frontend origins, e.g.
      # https://vinco.pages.dev,https://app.yourdomain.com
      - key: VISION_CORS_ALLOWED_ORIGINS
        sync: false
      - key: VISION_LOG_LEVEL
        value: INFO
      # The PostgreSQL schema VINCO's own tables live in, isolated from
      # the same database's `public` schema -- which the Supabase
      # project this backend authenticates against already owns (Auth/
      # RBAC tables, plus pre-existing UUID-keyed application tables
      # that collide by name with several of VINCO's, e.g. `contacts`/
      # `projects`/`invoices`). Not a secret -- committed as a plain
      # value. Also the code default (app/core/config.py), so this
      # entry exists for documentation/explicitness, not because
      # anything breaks without it.
      - key: VISION_STAGING_SCHEMA
        value: vinco
