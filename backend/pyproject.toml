[project]
name = "vision-contracting-profit"
version = "0.1.0"
description = "Private business application for Vision Contracting Company: project, quotation and profitability management."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "PyMuPDF>=1.24,<2.0",
    "PySide6>=6.6,<7.0",
    "google-api-python-client>=2.120,<3.0",
    "google-auth>=2.28,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "pyxlsb>=1.0,<2.0",
    "python-docx>=1.1,<2.0",
    "xlrd>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    # Required by FastAPI/Starlette to parse multipart/form-data request
    # bodies -- needed for the historical-import upload endpoint
    # (app/api/routers/imports.py's `UploadFile` parameters). FastAPI
    # itself only checks for this lazily, at route-registration time, and
    # raises a RuntimeError with no app ever starting if it's missing.
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "PyJWT[crypto]>=2.8,<3.0",
    # Production database driver. SQLite (the stdlib `sqlite3` module,
    # already available) remains the local-dev/test default -- this is
    # only exercised when `VISION_DATABASE_URL` points at a `postgresql://`
    # connection string. The `binary` extra ships a prebuilt wheel so a
    # deploy target never needs a C compiler or system libpq headers.
    "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "xlwt>=1.3,<2.0",
]
# Local, offline OCR (OCR Phase 1) -- optional: `app.core.ocr_engine`
# imports both lazily and degrades to `is_available() == False` when
# neither is installed, so the rest of the application is unaffected
# either way. Also requires the Tesseract binary itself on the machine
# (not a Python package, so not listed here) -- see app/core/ocr_engine.py.
ocr = [
    "pytesseract>=0.3,<1.0",
    "Pillow>=10.0,<11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
